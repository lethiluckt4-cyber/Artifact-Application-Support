    const s = this.state, CD = [["cqt", "Lấy dữ liệu Cục Thuế", ["Mỗi công ty có 2 tài khoản riêng: Hóa đơn điện tử (lấy hóa đơn) và Dịch vụ công (lấy tờ khai, thông báo, chứng từ nộp thuế).", "Mật khẩu được mã hóa trên máy chủ. Nhập hoặc đổi được, không ai xem lại được.", "Máy chủ tự đăng nhập, tự đọc captcha và tự lấy dữ liệu lúc 22:00 hằng đêm cho tất cả công ty.", "Muốn lấy ngay: vào Hóa đơn của công ty, bấm Lấy dữ liệu thủ công, chọn khoảng ngày (phần còn thiếu, tháng này, quý trước, từ đầu năm…).", "Mọi lần lấy đều xếp vào Hàng đợi Cục Thuế và chạy lần lượt từng công ty. Bấm ô Hàng đợi để xem công ty đang chạy, đang chờ và vừa xong.", "Công ty mất kết nối (sai mật khẩu, tài khoản bị khóa…) hiện ở thẻ Cảnh báo kết nối. Bấm Đăng nhập lại; kết nối xong phần mềm tự lấy lại toàn bộ dữ liệu từ thời điểm bị ngắt."]], ["ghep", "Ghép dữ liệu khi lấy về", ["Trùng (cùng MST người bán + ký hiệu + số hóa đơn, không đổi gì): bỏ qua, không tạo dòng mới.", "Còn thiếu trong kho: thêm vào.", "Đã có nhưng trạng thái trên Cục Thuế đã đổi (bị thay thế, bị điều chỉnh, đã hủy): cập nhật trạng thái, ghi hóa đơn liên quan. Kỳ chưa khóa thì tự cập nhật bảng kê; kỳ đã khóa thì báo cần khai bổ sung.", "Phần hạch toán, ghi chú, mã đối tượng đã nhập trên hóa đơn cũ được giữ nguyên.", "XML/PDF không cần cho số liệu. Bấm XML/PDF ở từng hóa đơn thì máy chủ mới tải từ Cục Thuế (hoặc chọn tải sẵn khi lấy dữ liệu)."]], ["tk", "Tờ khai GTGT", ["Hóa đơn bán ra, mua vào lấy từ Kho hóa đơn; chứng từ không có trên hệ thống (tờ khai hải quan, hóa đơn giấy…) nhập ở tab Chứng từ ngoài.", "Nút Khóa sổ chỉ bật khi không còn hóa đơn trong Kho chưa lên bảng kê. Chứng từ ngoài không đưa vào so sánh.", "Mua vào chưa kê khai: Đưa vào kê khai hoặc Không khấu trừ. Bán ra chưa kê khai: chỉ Đưa vào kê khai.", "Hóa đơn mua vào về trễ (kỳ của nó đã khóa) tự chuyển sang so sánh ở kỳ đang làm. Hóa đơn bán ra về trễ không chuyển kỳ: phải khai bổ sung kỳ cũ.", "Sau khi khóa, muốn sửa thì bấm Lập khai bổ sung ngay trong kỳ đó. Mỗi lần bổ sung là một bản riêng, lần trước giữ nguyên.", "Khai bổ sung (Phụ lục II Thông tư 89/2026/TT-BTC): chênh lệch số thuế chưa khấu trừ hết chuyển kỳ sau ghi vào [37] (giảm) hoặc [38] (tăng) của tờ khai kỳ phát hiện; tăng thuế phải nộp thì nộp thêm và tiền chậm nộp.", "Dòng chiết khấu, giảm giá, trả lại ghi âm. Hóa đơn chỉ có dòng chiết khấu hoặc hóa đơn điều chỉnh giảm thì tự ghi âm; hóa đơn dương có chữ chiết khấu thì hỏi lại."]], ["dau", "Số tiền khác Kho · không thu tiền", ["1. Hóa đơn chỉ có dòng chiết khấu thương mại (người bán ghi số dương): tự ghi âm.", "3. Hóa đơn dương có chữ giảm giá: hỏi xác nhận rồi mới ghi âm.", "4. Hóa đơn điều chỉnh giảm hoặc trả lại hàng mà ghi số dương là hóa đơn lập sai (điều chỉnh giảm, trả hàng luôn ghi số âm): phần mềm không tự đổi dấu, tạm loại khỏi bảng kê và báo ở Kiểm tra & cảnh báo để người bán lập lại.", "6. Hóa đơn bị thay thế hoặc đã hủy: Kho vẫn có số dương nhưng tờ khai ghi 0 (không khai).", "7. Tên hàng có chữ chiết khấu/giảm giá nhưng là hàng hóa thật: hỏi xác nhận, giữ dương.", "Không đổi: hóa đơn có dòng chiết khấu đã trừ trong hóa đơn (tổng hóa đơn không đổi), hóa đơn điều chỉnh tăng, hóa đơn điều chỉnh giảm đã ghi số âm, hàng khuyến mại thành tiền 0.", "Khác số (cùng dấu):", "8. Hóa đơn ngoại tệ: quy đổi VND theo tỷ giá ghi trên hóa đơn.", "9. Mua vào dùng chung cho hàng chịu thuế và không chịu thuế: thuế được khấu trừ theo tỷ lệ doanh thu chịu thuế.", "10. Ô tô dưới 9 chỗ nguyên giá trên 1,6 tỷ: không khấu trừ thuế của phần vượt.", "11. Hóa đơn từ 5 triệu đã quá hạn mà trả tiền mặt: không khấu trừ.", "12. Hóa đơn có dòng không chịu thuế: dòng đó tách khỏi giá trị mua vào chịu thuế.", "Không thu tiền:", "A. Hàng khuyến mại theo quy định thương mại: giá tính thuế 0.", "B. Biếu, tặng, cho: tính thuế theo giá bán của hàng cùng loại.", "C. Trả thay lương bằng hàng hóa, dịch vụ: tính thuế như bán.", "D. Tiêu dùng nội bộ để tiếp tục sản xuất kinh doanh: không tính thuế.", "E. Hàng mẫu, dùng thử: làm như  kỳ: đã trả đủ, trả thừa, còn thiếu.", "Hóa đơn quá hạn tính số ngày quá hạn đến hôm nay."]], ["bang", "Bảng và bộ lọc", ["Mọi bảng danh sách có nút ▾ ở tiêu đề cột: sắp xếp và lọc theo giá trị như Excel. Cột đang lọc có nút màu xanh.", "Bảng không chia trang; kéo thanh cuộn trong bảng để xem tiếp.", "Nhãn Không phát sinh dùng chung cho mọi phân hệ khi kỳ không có số liệu."]]];
